timezone: Asia/Dubai

# Each folder is one course; the folder name becomes the course name.
# Files are tagged lecture/lab by filename; a "lectures" or "labs" subfolder inside a
# course folder forces the kind. If unsure, the bot asks "Lecture or Lab?" on Telegram.
course_folders:
  - C:/Users/YOU/Desktop/UOWD/205
  - C:/Users/YOU/Desktop/UOWD/214
  - C:/Users/YOU/Desktop/UOWD/235

# Optional display names for course folders.
course_names:
  "205": CSIT205
  "214": CSIT214
  "235": CSCI235

# Files matching any of these globs are never processed (e.g. your own submissions).
ignore_patterns:
  - "*1234567*"
  - "~$*"

# Moodle file sync (only if MOODLE_TOKEN is set in .env). Read-only: lecture/lab files from your courses are
# downloaded into <course folder>\Moodle\. The first sync just makes local copies; later new files get summarised.
moodle_sync_every_minutes: 60
moodle_max_file_mb: 50

# Read text from image-only slides / scanned pages with the OCR built into Windows (runs locally).
ocr_enabled: true

# Voice notes / audio: transcribed locally with faster-whisper (model downloaded once into data/models).
# Models: tiny.en, base.en (default), small.en (more accurate, slower); for other languages use base/small
# and set voice_language (e.g. ar) or null to auto-detect.
voice_enabled: true
voice_model: base.en
voice_language: en

# On first sight of a folder, mark existing files as seen without summarising them.
backfill_existing: false

llm:
  provider: gemini             # anthropic | gemini
  anthropic_model: claude-sonnet-5-5
  gemini_models:               # tried in order; falls back when one is overloaded/rate-limited
    - gemini-3.8-flash
    - gemini-3.5-flash-lite
  max_single_request_chars: 300000   # longer docs are chunked (costs more requests)
  daily_token_cap: 400000      # input + output tokens per day

schedules:
  ingest_every_minutes: 30
  deadline_check_every_minutes: 15
  weekly_review: {day_of_week: sun, hour: 18, minute: 0}

alert_offsets:                 # label -> minutes before due
  7d: 10080
  3d: 4320
  1d: 1440
  3h: 180

deadlines_window_days: 14

# Moodle events whose title contains any of these (case-insensitive) are ignored,
# e.g. lab sections you're not in: ["TutorName_Monday"]
deadline_ignore: []
