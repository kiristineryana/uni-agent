[project]
name = "uni-agent"
version = "0.1.0"
description = "Personal university agent: Moodle deadlines, lecture/lab summaries and quizzes over Telegram"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6",
    "APScheduler>=3.10,<4",
    "icalendar>=6.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "watchdog>=5.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "anthropic>=0.69",
    "google-genai>=1.0",
    "tzdata>=2024.1",
    # Windows built-in OCR for image-only slides / scanned pages
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
uni-agent = "uni_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
